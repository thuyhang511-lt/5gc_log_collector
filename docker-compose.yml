services:
  server:
    build:
      context: .
      dockerfile: deployments/Dockerfile.server
    ports:
      - "9000:9000"
      - "8080:8080"
    environment:
      - TCP_ADDR=:9000
      - HTTP_ADDR=:8080
      - WORKER_COUNT=${WORKER_COUNT:-1}
      - CHANNEL_BUFFER=${CHANNEL_BUFFER:-8192}
      - STORAGE_DIR=/data/logs
      - STORAGE_SEGMENT_RECORDS=${STORAGE_SEGMENT_RECORDS:-1000000}
      - STORAGE_QUEUE=${STORAGE_QUEUE:-65536}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    volumes:
      # - log_data:/data
      - ./data:/data
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: deployments/Dockerfile.client
    depends_on:
      - server
    environment:
      - SERVER_ADDR=server:9000
      - PRODUCER_GOROUTINES=${PRODUCER_GOROUTINES:-8}
      - TARGET_EVENTS_PER_SEC=${TARGET_EVENTS_PER_SEC:-20000}
      - BATCH_SIZE=${BATCH_SIZE:-100}
    restart: "no"

