services:
  server:
    build:
      context: .
      dockerfile: deployments/Dockerfile.server

    ports:
      - "9000:9000"
      - "8080:8080"

    environment:
      - TCP_ADDR=:9000
      - HTTP_ADDR=:8080

      - WORKER_COUNT=${WORKER_COUNT:-1}
      - CHANNEL_BUFFER=${CHANNEL_BUFFER:-8192}

      - STORAGE_DIR=/data/logs
      - STORAGE_SEGMENT_RECORDS=${STORAGE_SEGMENT_RECORDS:-250000}
      - RETENTION_RECORDS=${RETENTION_RECORDS:-3000000}
      - STORAGE_QUEUE=${STORAGE_QUEUE:-16384}

      - CLICKHOUSE_ADDR=clickhouse:9000
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-default}
      - CLICKHOUSE_USERNAME=${CLICKHOUSE_USERNAME:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse}
      - CLICKHOUSE_BATCH_SIZE=${CLICKHOUSE_BATCH_SIZE:-1000}
      - CLICKHOUSE_QUEUE_SIZE=${CLICKHOUSE_QUEUE_SIZE:-16384}

    depends_on:
      - clickhouse

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

    volumes:
      - ./data:/data

    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9001:9000"
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DB: default
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: deployments/Dockerfile.client
    depends_on:
      - server
    environment:
      - SERVER_ADDR=server:9000
      - PRODUCER_GOROUTINES=${PRODUCER_GOROUTINES:-8}
      - TARGET_EVENTS_PER_SEC=${TARGET_EVENTS_PER_SEC:-20000}
      - BATCH_SIZE=${BATCH_SIZE:-100}
    restart: "no"

volumes:
  clickhouse_data:
  clickhouse_logs: